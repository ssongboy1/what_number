<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>홀 주문서</title>
<style>
  :root {
    --bg:#11141b; --card:#1b2130; --line:#2b3446; --line2:#3a465e;
    --text:#f4f7fb; --muted:#93a1b8; --accent:#ffc95c; --accent-ink:#2b2000;
    --done:#4ade80; --warn:#fbbf24; --late:#f87171; --takeout:#7ee6a8;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    touch-action:pan-y; user-select:none; -webkit-user-select:none;
    overscroll-behavior:contain;
  }
  button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

  header {
    position:sticky; top:0; z-index:20; height:48px; display:flex; align-items:center;
    gap:8px; padding:0 10px; background:rgba(17,20,27,.97);
    border-bottom:1px solid var(--line);
  }
  h1 { font-size:16px; margin:0; font-weight:800; letter-spacing:-.02em; white-space:nowrap;
       flex:0 0 auto; }
  .count { font-size:13px; color:var(--muted); font-weight:700; white-space:nowrap;
           overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; }
  .spacer { flex:1; }

  .toggle { display:flex; border:1px solid var(--line2); border-radius:10px; overflow:hidden;
            flex:0 0 auto; }
  .toggle button { padding:7px 11px; font-size:13.5px; font-weight:700; color:var(--muted);
                   white-space:nowrap; }
  .toggle button.on { background:var(--accent); color:var(--accent-ink); }

  .find {
    height:38px; padding:0 16px; border-radius:19px; background:var(--accent);
    color:var(--accent-ink); font-size:14px; font-weight:800;
    box-shadow:0 2px 8px rgba(0,0,0,.35); flex:0 0 auto; white-space:nowrap;
  }

  main { padding:12px; display:grid; gap:12px; touch-action:pan-y;
         grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); }

  .card { background:var(--card); border:1px solid var(--line); border-left:5px solid var(--line);
          border-radius:14px; overflow:hidden; }
  .card.warn { border-left-color:var(--warn); }
  .card.late { border-left-color:var(--late); }
  .card.ready { border-color:var(--done); border-left-color:var(--done); }

  .card-top { display:flex; align-items:baseline; gap:10px; padding:12px 14px 8px; }
  .table { font-size:34px; font-weight:800; letter-spacing:-.03em; line-height:1; }
  .badge { font-size:13px; font-weight:800; padding:3px 8px; border-radius:6px;
           background:rgba(255,201,92,.18); color:var(--accent); }
  .badge.takeout { background:rgba(126,230,168,.16); color:var(--takeout); }
  .ago { margin-left:auto; font-size:19px; font-weight:800; white-space:nowrap; }
  .ago.warn { color:var(--warn); } .ago.late { color:var(--late); }

  .group { padding:6px 14px 2px; font-size:13px; font-weight:700; color:var(--muted);
           border-top:1px dashed var(--line2); margin-top:4px; }

  .clear { width:100%; min-height:56px; background:var(--done); color:#0d2417;
           font-size:18px; font-weight:800; border-top:1px solid var(--line); }

  .item { position:relative; overflow:hidden; border-top:1px solid var(--line); }
  .item:first-of-type { border-top:none; }
  .itembody { display:flex; align-items:center; gap:12px; min-height:64px;
              padding:8px 14px; background:var(--card); position:relative; z-index:1;
              transition:transform .18s ease-out; }
  .item.sliding .itembody { transition:none; }
  /* 가니쉬가 있는 줄은 왼쪽에 작은 표시를 둬서 밀 수 있다는 걸 알린다 */
  .itembody.hasgar { box-shadow:inset 3px 0 0 rgba(255,201,92,.55); }
  .garhint { position:absolute; inset:0; display:flex; align-items:center;
             justify-content:space-between; padding:0 22px; font-size:16px; font-weight:800;
             color:var(--accent-ink); background:var(--accent); }
  .box { width:28px; height:28px; flex:0 0 auto; border:2.5px solid var(--line2);
         border-radius:7px; position:relative; }
  .item.on .box { background:var(--done); border-color:var(--done); }
  .item.on .box::after { content:""; position:absolute; left:8px; top:2px; width:8px; height:15px;
         border:solid #0d2417; border-width:0 3px 3px 0; transform:rotate(45deg); }
  .name { font-size:21px; font-weight:700; line-height:1.25; }
  .opt { font-size:15px; color:var(--muted); margin-top:2px; }
  .item.on .name, .item.on .opt { text-decoration:line-through; opacity:.45; }
  .qty { margin-left:auto; font-size:17px; font-weight:800; color:var(--accent);
         background:rgba(255,201,92,.14); padding:3px 9px; border-radius:7px; }

  /* 가니쉬 */
  .garbox { position:fixed; inset:0; z-index:60; background:rgba(8,10,14,.86); display:none;
            align-items:center; justify-content:center; padding:24px; }
  .garbox.show { display:flex; }
  .garcard { background:var(--card); border:1px solid var(--line2); border-radius:18px;
             padding:24px 26px; max-width:640px; width:100%; max-height:88%; overflow-y:auto; }
  .garcard h2 { margin:0 0 4px; font-size:30px; font-weight:800; }
  .garcard .sec { font-size:14px; color:var(--muted); font-weight:700; margin-bottom:18px; }
  .garcard .lab { font-size:14px; color:var(--muted); font-weight:800; margin:16px 0 8px; }
  .steps { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .step { background:rgba(255,201,92,.16); color:var(--accent); border-radius:10px;
          padding:11px 15px; font-size:20px; font-weight:800; }
  .arrow { color:var(--muted); font-size:18px; font-weight:800; }
  .sepv { background:rgba(126,230,168,.14); color:var(--takeout); border-radius:10px;
          padding:11px 15px; font-size:19px; font-weight:800; }
  .toolv { background:var(--line); border-radius:10px; padding:11px 15px; font-size:19px;
           font-weight:700; }
  .garcard .close { width:100%; min-height:60px; margin-top:24px; border-radius:12px;
                    background:var(--line); font-size:18px; font-weight:800; }
  .garnone { color:var(--muted); font-size:17px; line-height:1.8; }

  .empty { grid-column:1/-1; text-align:center; color:var(--muted); padding:80px 20px;
           font-size:16px; line-height:2; }
  .empty b { display:block; color:var(--text); font-size:20px; margin-bottom:8px; }

  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--card);
           border-top:2px solid var(--done); padding:18px 20px 22px;
           box-shadow:0 -6px 24px rgba(0,0,0,.5); display:none; }
  .sheet.show { display:block; }
  .sheet p { margin:0 0 14px; font-size:20px; font-weight:700; }
  .sheet .row { display:flex; gap:12px; }
  .sheet button { flex:1; min-height:60px; border-radius:12px; font-size:18px; font-weight:800; }
  .ok { background:var(--done); color:#0d2417; }
  .later { background:var(--line); color:var(--text); }

  .undo { position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:41;
          background:var(--card); border:1px solid var(--line2); border-radius:12px;
          padding:12px 16px; display:none; align-items:center; gap:14px; font-size:16px; }
  .undo.show { display:flex; }
  .undo button { background:var(--accent); color:var(--accent-ink); font-weight:800;
                 padding:10px 16px; border-radius:9px; }

  .overlay { position:fixed; inset:0; z-index:50; background:var(--bg); display:none;
             flex-direction:column; }
  .overlay.show { display:flex; }
  .ov-top { display:flex; gap:12px; padding:14px; border-bottom:1px solid var(--line); }
  .ov-top input { flex:1; min-height:56px; background:var(--card); border:1px solid var(--line2);
                  border-radius:12px; padding:0 16px; font-size:20px; color:var(--text); }
  .ov-top button { min-width:96px; background:var(--line); border-radius:12px; font-size:17px;
                   font-weight:700; }
  .ov-body { flex:1; overflow-y:auto; padding:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; }
  .chip { background:var(--card); border:1px solid var(--line2); border-radius:11px;
          padding:14px 16px; font-size:17px; font-weight:700; }
  .hit { background:var(--card); border:1px solid var(--line); border-radius:12px;
         padding:14px 16px; margin-bottom:10px; }
  .hit .h { display:flex; align-items:baseline; gap:12px; }
  .hit .t { font-size:26px; font-weight:800; }
  .hit .s { margin-left:auto; font-size:16px; color:var(--muted); }
  .hit .m { margin-top:8px; font-size:16px; line-height:1.6; color:#cfd9e8; }
  .hit .m .mine { color:var(--accent); font-weight:800; }
  .hit .m .gone { text-decoration:line-through; opacity:.45; }

  /* 새 주문 알림 */
  .flash { position:fixed; inset:0; z-index:80; pointer-events:none; opacity:0;
           background:var(--accent); }
  .flash.on { animation:flash .7s ease-out 2; }
  @keyframes flash { 0%{opacity:0} 25%{opacity:.30} 100%{opacity:0} }

  .card.fresh { animation:cardin 2.4s ease-out; }
  @keyframes cardin {
    0%   { box-shadow:0 0 0 4px var(--accent); transform:scale(1.015); }
    100% { box-shadow:0 0 0 0 rgba(255,201,92,0); transform:scale(1); }
  }

  /* 카드를 가리지 않도록 머리말 아래 띠로 붙인다 */
  .pending { position:sticky; top:48px; z-index:35; display:none;
             background:var(--accent); color:var(--accent-ink);
             padding:16px; font-size:21px; font-weight:800; text-align:center;
             box-shadow:0 4px 14px rgba(0,0,0,.4); animation:pulse 1.8s ease-in-out infinite; }
  .pending.show { display:block; }
  @keyframes pulse { 0%,100%{filter:brightness(1)} 50%{filter:brightness(.88)} }

  .zoom { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:85;
          background:rgba(0,0,0,.78); color:#fff; border-radius:16px; padding:18px 28px;
          font-size:34px; font-weight:800; opacity:0; transition:opacity .15s;
          pointer-events:none; }
  .zoom.show { opacity:1; }

  .offline { position:fixed; inset:0; z-index:90; background:rgba(10,12,17,.93); display:none;
             align-items:center; justify-content:center; text-align:center; font-size:22px;
             font-weight:800; line-height:1.8; }
  .offline.show { display:flex; }
</style>
</head>
<body>
<header>
  <h1>홀 주문서</h1>
  <span class="count" id="count"></span>
  <div class="spacer"></div>
  <div class="toggle">
    <button id="byTicket" onclick="setView('ticket')">주문서별</button>
    <button id="byTable" onclick="setView('table')">테이블별</button>
  </div>
  <div class="toggle">
    <button id="autoAdd" onclick="setHold(false)">바로 넣기</button>
    <button id="holdNew" onclick="setHold(true)">모아두기</button>
  </div>
  <button class="find" onclick="openFind()">메뉴 찾기</button>
</header>

<div class="pending" id="pending" onclick="showPending()"></div>
<div class="flash" id="flash"></div>
<div class="zoom" id="zoomHint"></div>

<main id="board"></main>

<div class="sheet" id="sheet">
  <p id="sheetText"></p>
  <div class="row">
    <button class="ok" onclick="confirmDone()">내리기</button>
    <button class="later" onclick="closeSheet()">조금 더 두기</button>
  </div>
</div>

<div class="undo" id="undo">
  <span>주문서를 내렸습니다</span>
  <button onclick="undoDone()">되돌리기</button>
</div>

<div class="overlay" id="find">
  <div class="ov-top">
    <input id="q" placeholder="메뉴 이름 또는 초성" oninput="renderFind()" autocomplete="off">
    <button onclick="closeFind()">닫기</button>
  </div>
  <div class="ov-body" id="findBody"></div>
</div>

<div class="garbox" id="garbox" onclick="closeGarnish(event)">
  <div class="garcard" id="garcard" onclick="event.stopPropagation()"></div>
</div>

<div class="offline" id="offline">연결이 끊겼습니다<br>화면이 최신이 아닙니다</div>

}

    received_at: Date.now() / 1000, ordered_at: Date.now() / 1000,
    status: "open", item_count: items.length, served_count: 0,
    rev: DEMO.rev, items: items,
  });
  return id;
}

// 한 장씩 시간차를 두고 들어오게 한다. 실제로는 이렇게 몰려 들어온다.
function demoBurst(count, gapMs) {
  let n = 0;
  const step = () => {
    demoAddTicket();
    if (typeof refresh === "function") refresh();
    if (++n < count) setTimeout(step, gapMs || 1200);
  };
  step();
}

function demoAuto() {
  const btn = document.getElementById("demoAuto");
  if (DEMO.auto) {
    clearInterval(DEMO.auto); DEMO.auto = null;
    btn.textContent = "자동";
    btn.style.background = "#2b3446";
    btn.style.color = "#f4f7fb";
  } else {
    DEMO.auto = setInterval(() => { demoAddTicket(); refresh(); }, 6000);
    btn.textContent = "자동 켜짐";
    btn.style.background = "#4ade80";
    btn.style.color = "#0d2417";
  }
}

function demoReset() {
  if (DEMO.auto) { clearInterval(DEMO.auto); DEMO.auto = null; }
  DEMO.tickets = JSON.parse(JSON.stringify(DEMO_START));
  // 시각도 처음 상태로 되돌린다. 안 그러면 계속 오래된 주문서로 남는다.
  const now = Date.now() / 1000;
  for (const t of DEMO.tickets) {
    if (typeof t.age_min === "number") {
      t.received_at = now - t.age_min * 60;
      t.ordered_at = t.received_at;
    }
  }
  DEMO.rev += 1;
  const btn = document.getElementById("demoAuto");
  if (btn) { btn.textContent = "자동"; btn.style.background = "#2b3446"; btn.style.color = "#f4f7fb"; }
  if (typeof refresh === "function") { seenIds = null; refresh(); }
}

window.fetch = async function (url, options) {
  const path = String(url);
  const body = options && options.body ? JSON.parse(options.body) : null;
  let payload = {};

  if (path.indexOf("/api/hall/state") === 0) {
    const live = DEMO.tickets.filter(t => t.status === "open" || t.status === "ready");
    live.sort((a, b) => a.received_at - b.received_at);
    payload = {rev: DEMO.rev, tickets: live, counts: {open: live.length, ready: 0}};
  } else if (path.indexOf("/api/hall/menus") === 0) {
    payload = {menus: DEMO.menus};
  } else if (path.indexOf("/api/hall/garnish") === 0) {
    payload = {garnish: DEMO.garnish};
  } else if (path.indexOf("/api/hall/search") === 0) {
    const wanted = decodeURIComponent(path.split("menu=")[1] || "");
    const hits = DEMO.tickets
      .filter(t => t.status !== "void" && t.items.some(i => i.menu.indexOf(wanted) >= 0))
      .slice()
      .sort((a, b) => b.received_at - a.received_at);
    payload = {menu: wanted, tickets: hits};
  } else if (/\/api\/hall\/items\/(\d+)\/served/.test(path)) {
    const id = Number(path.match(/items\/(\d+)/)[1]);
    const [ticket, item] = demoFindItem(id);
    if (!ticket) return new Response("{}", {status: 404});
    const wasReady = ticket.status === "ready";
    item.served = !!body.served;
    item.served_at = item.served ? Date.now() / 1000 : null;
    demoRecount(ticket);
    payload = {ok: true, ticket_id: ticket.id, status: ticket.status,
               served_count: ticket.served_count, item_count: ticket.item_count,
               became_ready: ticket.status === "ready" && !wasReady};
  } else if (/\/api\/hall\/tickets\/(\d+)\/status/.test(path)) {
    const id = Number(path.match(/tickets\/(\d+)/)[1]);
    const ticket = DEMO.tickets.find(t => t.id === id);
    if (!ticket) return new Response("{}", {status: 404});
    ticket.status = body.status;
    DEMO.rev += 1;
    ticket.rev = DEMO.rev;
    if (body.status === "open") demoRecount(ticket);
    payload = {ok: true, ticket_id: id, status: ticket.status};
  } else {
    return new Response("{}", {status: 404});
  }
  return new Response(JSON.stringify(payload),
    {status: 200, headers: {"Content-Type": "application/json"}});
};
</script>

<script>

  // 시험용 단추는 남은 메뉴 표시와 보기 토글 사이에 둔다
  const style = "height:34px;padding:0 11px;border-radius:9px;background:#2b3446;" +
                "font-size:13px;font-weight:700;white-space:nowrap;color:#f4f7fb;" +
                "border:1px solid #3a465e";
  document.querySelector("header .spacer").insertAdjacentHTML("afterend",

    '<button onclick="demoBurst(5)" style="' + style + '">연속 5건</button>' +

<script>
let state = {rev: -1, tickets: []};
let view = localStorage.getItem("hallView") || "ticket";
let holdNew = localStorage.getItem("hallHold") === "1";
let seenIds = null;      // 지금까지 받아본 주문서. null 이면 첫 조회
let shownIds = new Set();  // 화면에 올린 주문서
let heldIds = new Set();   // 모아둔 새 주문서
let freshIds = new Set();  // 방금 올라와 잠시 강조할 주문서
let uiScale = parseFloat(localStorage.getItem("hallScale") || "1") || 1;
let pending = {};          // 서버 응답 전에도 즉시 반응하도록
let sheetTicket = null, lastDone = null, lastOk = Date.now();
let menus = [], findResults = null;
let garnish = null;      // 메뉴이름(다듬은 것) -> 안내

function garKey(name) {
  return String(name || "").replace(/[\(\[][^\)\]]*[\)\]]/g, " ")
    .replace(/\s+/g, "").toLowerCase();
}

function findGarnish(menu) {
  if (!garnish) return null;
  const key = garKey(menu);
  if (!key) return null;
  if (garnish[key]) return garnish[key];
  let best = null, bestLen = 0;
  for (const k in garnish) {
    if (k.length < 4 || k.length <= bestLen) continue;
    if (k.indexOf(key) >= 0 || key.indexOf(k) >= 0) { best = garnish[k]; bestLen = k.length; }
  }
  return best;
}

function garnishHtml(info, withClose) {
  const steps = info.sprinkle.length
    ? '<div class="lab">뿌리는 순서</div><div class="steps">' +
      info.sprinkle.map(esc).map(v => '<span class="step">' + v + "</span>")
        .join('<span class="arrow">&#9654;</span>') + "</div>"
    : "";
  const sep = info.separate.length
    ? '<div class="lab">따로 내기</div><div class="steps">' +
      info.separate.map(v => '<span class="sepv">' + esc(v) + "</span>").join("") + "</div>"
    : "";
  const tools = info.tools
    ? '<div class="lab">집기</div><div class="steps"><span class="toolv">' +
      esc(info.tools) + "</span></div>"
    : "";
  const none = (!steps && !sep && !tools)
    ? '<div class="garnone">이 메뉴는 가니쉬 안내가 없습니다</div>' : "";
  return "<h2>" + esc(info.menu) + "</h2>" +
    '<div class="sec">' + esc(info.section || "") + "</div>" +
    steps + sep + tools + none +
    (withClose ? '<button class="close" onclick="closeGarnish()">닫기</button>' : "");
}

function openGarnish(menu) {
  const info = findGarnish(menu);
  if (!info) return;
  document.getElementById("garcard").innerHTML = garnishHtml(info, true);
  document.getElementById("garbox").classList.add("show");
}

function closeGarnish(event) {
  if (event && event.target.id !== "garbox") return;
  document.getElementById("garbox").classList.remove("show");
}

const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function chosung(text) {
  let out = "";
  for (const ch of text) {
    const code = ch.charCodeAt(0) - 0xAC00;
    out += (code >= 0 && code <= 11171) ? CHO[Math.floor(code / 588)] : ch;
  }
  return out;
}
function esc(s) {
  return (s || "").replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function agoText(ts) {
  const m = Math.floor((Date.now() / 1000 - ts) / 60);
  if (m < 1) return "방금";
  if (m < 60) return m + "분";
  return Math.floor(m / 60) + "시간 " + (m % 60) + "분";
}
function agoClass(ts) {
  const m = (Date.now() / 1000 - ts) / 60;
  return m > 20 ? "late" : (m > 10 ? "warn" : "");
}
function isServed(item) {
  return (item.id in pending) ? pending[item.id] : item.served;
}

function setView(v) {
  view = v; localStorage.setItem("hallView", v); render();
}

function setHold(on) {
  holdNew = on;
  localStorage.setItem("hallHold", on ? "1" : "0");
  if (!on) showPending();   // 바로 넣기로 바꾸면 모아둔 것을 즉시 올린다
  render();
}

function showPending() {
  for (const id of heldIds) { shownIds.add(id); freshIds.add(id); }
  heldIds.clear();
  render();
  setTimeout(() => { freshIds.clear(); render(); }, 2600);
}

// --- 화면 크기 (두 손가락으로 벌리고 오므리기) ---
function applyScale(showHint) {
  // 주문서 영역만 키운다. 상단바는 늘 같은 크기여야 조작이 흔들리지 않는다.
  document.getElementById("board").style.zoom = uiScale;
  localStorage.setItem("hallScale", String(uiScale));
  if (!showHint) return;
  const hint = document.getElementById("zoomHint");
  hint.textContent = Math.round(uiScale * 100) + "%";
  hint.classList.add("show");
  clearTimeout(applyScale.timer);
  applyScale.timer = setTimeout(() => hint.classList.remove("show"), 800);
}

function fingerGap(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}

let pinchGap = 0, pinchFrom = 1, pinchWaiting = false;

document.addEventListener("touchstart", e => {
  // 손가락이 둘이 된 순간에만 기준을 잡는다. 도중에 다시 잡으면 화면이 튄다.
  if (e.touches.length === 2 && !pinchGap) {
    pinchGap = fingerGap(e.touches);
    pinchFrom = uiScale;
    cancelPress();
    cancelSwipe();
  }
}, {passive: false});

document.addEventListener("touchmove", e => {
  if (e.touches.length !== 2 || !pinchGap) return;
  e.preventDefault();                       // 브라우저 확대가 끼어들지 못하게
  const gap = fingerGap(e.touches);
  if (Math.abs(gap - pinchGap) < 12) return;  // 손 떨림은 무시
  const wanted = pinchFrom * (gap / pinchGap);
  // 0.05 단위로 끊어야 화면을 다시 그리는 횟수가 줄어 매끄럽다
  const stepped = Math.min(2.2, Math.max(0.6, Math.round(wanted * 20) / 20));
  if (stepped === uiScale || pinchWaiting) return;
  uiScale = stepped;
  pinchWaiting = true;
  requestAnimationFrame(() => { pinchWaiting = false; applyScale(true); });
}, {passive: false});

document.addEventListener("touchend", e => {
  if (e.touches.length < 2) pinchGap = 0;
}, {passive: true});
document.addEventListener("touchcancel", () => { pinchGap = 0; }, {passive: true});

function flashScreen() {
  const box = document.getElementById("flash");
  box.classList.remove("on");
  void box.offsetWidth;      // 애니메이션을 다시 시작시키려면 필요하다
  box.classList.add("on");
}

function itemHtml(item) {
  const on = isServed(item);
  const opt = item.option ? '<div class="opt">' + esc(item.option) + "</div>" : "";
  const qty = item.qty > 1 ? '<span class="qty">x' + item.qty + "</span>" : "";
  const hasGar = !!findGarnish(item.menu);
  const hint = hasGar
    ? '<div class="garhint"><span>가니쉬</span><span>가니쉬</span></div>' : "";
  return '<div class="item ' + (on ? "on" : "") + '" data-id="' + item.id + '"' +
    (hasGar ? ' data-gar="' + esc(item.menu) + '"' : "") + ">" + hint +
    '<div class="itembody' + (hasGar ? " hasgar" : "") + '">' +
    '<div class="box"></div><div style="flex:1;min-width:0"><div class="name">' +
    esc(item.menu) + "</div>" + opt + "</div>" + qty + "</div></div>";
}

function cardHtml(head, tickets) {
  const first = tickets[0];
  let cls = first.status === "ready" ? "ready" : agoClass(first.received_at);
  if (tickets.some(t => freshIds.has(t.id))) cls += " fresh";
  let body = "";
  tickets.forEach((t, i) => {
    if (i > 0) {
      const when = new Date(t.received_at * 1000);
      body += '<div class="group">추가 ' +
        String(when.getHours()).padStart(2, "0") + ":" +
        String(when.getMinutes()).padStart(2, "0") + "</div>";
    }
    body += t.items.map(itemHtml).join("");
  });
  const ready = tickets.filter(t => t.status === "ready");
  if (ready.length) {
    const label = ready.length > 1 ? "주문서 " + ready.length + "장 내리기" : "주문서 내리기";
    body += '<button class="clear" onclick="clearTickets(' +
      JSON.stringify(ready.map(t => t.id)).replace(/"/g, "&quot;") + ')">' + label + "</button>";
  }
  return '<div class="card ' + cls + '">' + head + body + "</div>";
}

async function clearTickets(ids) {
  for (const id of ids) {
    await post("/api/hall/tickets/" + id + "/status", {status: "done"});
  }
  lastDone = ids[ids.length - 1];
  const bar = document.getElementById("undo");
  bar.classList.add("show");
  setTimeout(() => bar.classList.remove("show"), 20000);
  await refresh();
}

function headHtml(t, extra) {
  const takeout = /포장/.test(t.table);
  const badge = extra ? '<span class="badge">' + extra + "</span>" :
    (t.kind === "추가" ? '<span class="badge">추가</span>' : "");
  const to = takeout ? '<span class="badge takeout">포장</span>' : "";
  return '<div class="card-top"><span class="table">' + esc(t.table) + "</span>" + to + badge +
    '<span class="ago ' + agoClass(t.received_at) + '">' + agoText(t.received_at) + "</span></div>";
}

function render() {
  document.getElementById("byTicket").className = view === "ticket" ? "on" : "";
  document.getElementById("byTable").className = view === "table" ? "on" : "";

  document.getElementById("autoAdd").className = holdNew ? "" : "on";
  document.getElementById("holdNew").className = holdNew ? "on" : "";

  const banner = document.getElementById("pending");
  if (heldIds.size) {
    banner.textContent = "새 주문 " + heldIds.size + "건 - 누르면 올립니다";
    banner.classList.add("show");
  } else {
    banner.classList.remove("show");
  }

  const board = document.getElementById("board");
  const list = state.tickets.filter(t => shownIds.has(t.id));
  if (!list.length) {
    board.innerHTML = heldIds.size
      ? '<div class="empty"><b>새 주문 ' + heldIds.size + "건이 기다리고 있습니다</b>" +
        "위의 노란 알림을 누르면 올라옵니다</div>"
      : '<div class="empty"><b>진행 중인 주문서가 없습니다</b>' +
        "새 주문서가 들어오면 여기에 나타납니다</div>";
    document.getElementById("count").textContent = "";
    return;
  }

  let html = "";
  if (view === "ticket") {
    html = list.map(t => cardHtml(headHtml(t), [t])).join("");
  } else {
    const groups = new Map();
    for (const t of list) {
      if (!groups.has(t.table_key)) groups.set(t.table_key, []);
      groups.get(t.table_key).push(t);
    }
    for (const [, ts] of groups) {
      const extra = ts.length > 1 ? "주문서 " + ts.length + "장" : "";
      html += cardHtml(headHtml(ts[0], extra), ts);
    }
  }
  board.innerHTML = html;

  const left = list.reduce((n, t) => n + t.item_count - t.served_count, 0);
  document.getElementById("count").textContent =
    "주문서 " + list.length + "장 · 남은 메뉴 " + left + "개";
}

// --- 체크 ---
let pressTimer = null, pressedId = null;
function cancelPress() {
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  pressedId = null;
}
// --- 옆으로 밀면 가니쉬 ---
let swipe = null;
const SWIPE_START = 10;   // 이만큼 움직여야 미는 것으로 본다
const SWIPE_OPEN = 70;    // 이만큼 밀면 안내를 연다

function cancelSwipe() {
  if (swipe && swipe.body) {
    swipe.row.classList.remove("sliding");
    swipe.body.style.transform = "";
  }
  swipe = null;
}

const board = document.getElementById("board");

board.addEventListener("pointerdown", e => {
  const row = e.target.closest(".item");
  if (!row) return;

  if (row.dataset.gar) {
    swipe = {row: row, body: row.querySelector(".itembody"), menu: row.dataset.gar,
             x: e.clientX, y: e.clientY, moving: false};
  }

  pressedId = Number(row.dataset.id);
  if (!row.classList.contains("on")) return;   // 체크는 탭
  pressTimer = setTimeout(() => {              // 해제는 길게 눌러야 한다
    pressTimer = null;
    setServed(pressedId, false);
    pressedId = null;
  }, 500);
});

board.addEventListener("pointermove", e => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x;
  const dy = e.clientY - swipe.y;
  if (!swipe.moving) {
    if (Math.abs(dy) > Math.abs(dx)) { cancelSwipe(); return; }  // 세로로 넘기는 중
    if (Math.abs(dx) < SWIPE_START) return;
    swipe.moving = true;
    swipe.row.classList.add("sliding");
    cancelPress();                              // 미는 동안은 체크로 세지 않는다
  }
  const capped = Math.max(-110, Math.min(110, dx));
  swipe.body.style.transform = "translateX(" + capped + "px)";
});

board.addEventListener("pointerup", e => {
  if (swipe && swipe.moving) {
    const dx = e.clientX - swipe.x;
    const menu = swipe.menu;
    cancelSwipe();
    cancelPress();
    if (Math.abs(dx) >= SWIPE_OPEN) openGarnish(menu);
    return;
  }
  cancelSwipe();

  const row = e.target.closest(".item");
  const id = pressedId;          // 길게 눌러 해제됐으면 타이머가 이미 비워 놓는다
  cancelPress();
  if (!row || id === null) return;
  if (!row.classList.contains("on")) setServed(id, true);
});

board.addEventListener("pointercancel", () => { cancelPress(); cancelSwipe(); });

async function setServed(itemId, served) {
  pending[itemId] = served;
  render();
  try {
    const res = await post("/api/hall/items/" + itemId + "/served", {served: served});
    delete pending[itemId];
    if (res.became_ready) openSheet(res.ticket_id);
    await refresh();
  } catch (e) {
    delete pending[itemId];
    render();
  }
}

function openSheet(ticketId) {
  const t = state.tickets.find(x => x.id === ticketId);
  sheetTicket = ticketId;
  document.getElementById("sheetText").textContent =
    (t ? t.table + " " : "") + "메뉴가 모두 나왔습니다. 주문서를 내릴까요?";
  document.getElementById("sheet").classList.add("show");
}
function closeSheet() {
  document.getElementById("sheet").classList.remove("show"); sheetTicket = null;
}
async function confirmDone() {
  const id = sheetTicket;
  closeSheet();
  if (!id) return;
  await post("/api/hall/tickets/" + id + "/status", {status: "done"});
  lastDone = id;
  const bar = document.getElementById("undo");
  bar.classList.add("show");
  setTimeout(() => bar.classList.remove("show"), 20000);
  await refresh();
}
async function undoDone() {
  document.getElementById("undo").classList.remove("show");
  if (lastDone) { await post("/api/hall/tickets/" + lastDone + "/status", {status: "open"}); }
  lastDone = null;
  await refresh();
}

// --- 메뉴 찾기 ---
async function openFind() {
  document.getElementById("find").classList.add("show");
  document.getElementById("q").value = "";
  findResults = null;
  if (!menus.length) {
    try { menus = (await getJson("/api/hall/menus")).menus || []; } catch (e) { menus = []; }
  }
  renderFind();
}
function closeFind() { document.getElementById("find").classList.remove("show"); }

function renderFind() {
  const q = document.getElementById("q").value.trim();
  const body = document.getElementById("findBody");
  if (findResults && findResults.q === q) { body.innerHTML = hitsHtml(findResults); return; }

  let list = menus;
  if (q) {
    const qc = chosung(q);
    list = menus.filter(m => m.menu.includes(q) || chosung(m.menu).includes(qc));
  } else {
    list = menus.slice(0, 24);
  }
  body.innerHTML = '<div class="chips">' +
    list.slice(0, 40).map(m =>
      '<button class="chip" onclick="searchMenu(' + JSON.stringify(m.menu).replace(/"/g, "&quot;") +
      ')">' + esc(m.menu) + "</button>").join("") +
    "</div>" + (q && !list.length ? '<div class="empty">찾는 메뉴가 없습니다</div>' : "");
}

async function searchMenu(menu) {
  const data = await getJson("/api/hall/search?menu=" + encodeURIComponent(menu));
  findResults = {q: document.getElementById("q").value.trim(), menu: menu, tickets: data.tickets};
  document.getElementById("findBody").innerHTML = hitsHtml(findResults);
}

function hitsHtml(r) {
  if (!r.tickets.length) {
    const only = findGarnish(r.menu);
    return '<div class="chips"><button class="chip" onclick="findResults=null;renderFind()">' +
      "&#8592; 메뉴 다시 고르기</button></div>" +
      (only ? '<div class="hit">' + garnishHtml(only, false) + "</div>" : "") +
      '<div class="empty"><b>' + esc(r.menu) + "</b>오늘 이 메뉴 주문이 없습니다</div>";
  }
  const info = findGarnish(r.menu);
  const garCard = info
    ? '<div class="hit" style="border-color:var(--line2)">' + garnishHtml(info, false) + "</div>"
    : "";
  return '<div class="chips"><button class="chip" onclick="findResults=null;renderFind()">' +
    "&#8592; 메뉴 다시 고르기</button></div>" + garCard +
    r.tickets.map(t => {
      const when = new Date(t.received_at * 1000);
      const time = String(when.getHours()).padStart(2, "0") + ":" +
                   String(when.getMinutes()).padStart(2, "0");
      const lines = t.items.map(i => {
        const mine = i.menu.includes(r.menu);
        return '<span class="' + (mine ? "mine " : "") + (i.served ? "gone" : "") + '">' +
          esc(i.menu) + (i.option ? " (" + esc(i.option) + ")" : "") + "</span>";
      }).join(" &#183; ");
      return '<div class="hit"><div class="h"><span class="t">' + esc(t.table) + "</span>" +
        '<span class="s">' + time + " &#183; " + agoText(t.received_at) + " 전 &#183; " +
        t.served_count + "/" + t.item_count + " 나감</span></div>" +
        '<div class="m">' + lines + "</div></div>";
    }).join("");
}

// --- 서버와 맞추기 ---
async function getJson(url) {
  const res = await fetch(url, {cache: "no-store"});
  if (!res.ok) throw new Error(res.status);
  return res.json();
}
async function post(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(res.status);
  lastOk = Date.now();
  return res.json();
}
async function refresh() {
  try {
    const data = await getJson("/api/hall/state");
    lastOk = Date.now();
    document.getElementById("offline").classList.remove("show");
    if (data.rev === state.rev) return;

    const ids = new Set(data.tickets.map(t => t.id));
    let arrived = [];
    if (seenIds === null) {
      // 첫 조회. 이미 있던 것은 새 주문이 아니다
      seenIds = ids;
      shownIds = new Set(ids);
    } else {
      arrived = data.tickets.filter(t => !seenIds.has(t.id));
      for (const t of arrived) {
        seenIds.add(t.id);
        if (holdNew) heldIds.add(t.id);
        else { shownIds.add(t.id); freshIds.add(t.id); }
      }
      // 사라진 주문서는 기억에서도 지운다
      for (const set of [seenIds, shownIds, heldIds, freshIds]) {
        for (const id of Array.from(set)) if (!ids.has(id)) set.delete(id);
      }
    }

    state = data;
    render();
    if (arrived.length) {
      flashScreen();
      if (!holdNew) setTimeout(() => { freshIds.clear(); render(); }, 2600);
    }
  } catch (e) {
    if (Date.now() - lastOk > 10000) {
      document.getElementById("offline").classList.add("show");
    }
  }
}

applyScale(false);
setView(view);
getJson("/api/hall/garnish")
  .then(data => { garnish = data.garnish || {}; render(); })
  .catch(() => { garnish = {}; });
refresh();
setInterval(refresh, 1500);
setInterval(render, 20000);   // 경과 시간 표시를 계속 맞춘다
</script>
